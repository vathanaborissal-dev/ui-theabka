<svg xmlns="http://www.w3.org/2000/svg" width="140" height="152" viewBox="0 0 140 152" role="img" aria-label="Thiep happy" xmlns:c2pa="http://c2pa.org/manifest"><style><![CDATA[
    /* Keyframes as authored by the design team in their canvas file;
       the SVG export dropped the style blocks. */
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes blink{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
    @keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-13px)}}
    @keyframes spark{0%{opacity:0;transform:translateY(6px) scale(.6)}35%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(1)}}
    @keyframes tilt{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-6deg)}}
    @keyframes think{0%,70%,100%{opacity:0;transform:scale(.5)}25%,55%{opacity:1;transform:scale(1)}}
    @keyframes shove{0%,100%{transform:translateX(0)}55%{transform:translateX(9px)}}
    @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.04)}}
    @keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
    .jump{animation:jump 1s cubic-bezier(.3,0,.4,1) infinite}
    .sp{transform-box:fill-box;transform-origin:center;animation:spark 1.4s ease-out infinite}
    .s2{animation-delay:.25s}.s3{animation-delay:.5s}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  ]]></style><metadata><c2pa:manifest></c2pa:manifest></metadata>

<g fill="#c39b52"><circle class="sp" cx="28" cy="42" r="3.5"></circle><circle class="sp s2" cx="70" cy="24" r="4"></circle><circle class="sp s3" cx="112" cy="42" r="3.5"></circle></g>
<g transform="translate(10 26)"><g class="jump"><path d="M26 68 Q11 58 15 46" fill="none" stroke="#8c2f39" stroke-width="5.5" stroke-linecap="round"></path><path d="M94 68 Q109 58 105 46" fill="none" stroke="#8c2f39" stroke-width="5.5" stroke-linecap="round"></path><path d="M46 100 V109" fill="none" stroke="#8c2f39" stroke-width="6" stroke-linecap="round"></path><path d="M74 100 V109" fill="none" stroke="#8c2f39" stroke-width="6" stroke-linecap="round"></path><rect x="26" y="14" width="68" height="86" rx="17" fill="#fdfaf4" stroke="#8c2f39" stroke-width="6"></rect><circle cx="38" cy="60" r="4.5" fill="#c39b52" opacity=".55"></circle><circle cx="82" cy="60" r="4.5" fill="#c39b52" opacity=".55"></circle><path d="M42 50 Q48 43 54 50" fill="none" stroke="#8c2f39" stroke-width="4.5" stroke-linecap="round"></path><path d="M66 50 Q72 43 78 50" fill="none" stroke="#8c2f39" stroke-width="4.5" stroke-linecap="round"></path><path d="M48 62 Q60 77 72 62" fill="none" stroke="#8c2f39" stroke-width="5" stroke-linecap="round"></path><circle cx="60" cy="86" r="8" fill="#c39b52"></circle></g></g>
</svg>
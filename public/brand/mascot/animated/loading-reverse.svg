<svg xmlns="http://www.w3.org/2000/svg" width="140" height="152" viewBox="0 0 140 152" role="img" aria-label="Thiep loading" xmlns:c2pa="http://c2pa.org/manifest"><style><![CDATA[
    /* Keyframes as authored by the design team in their canvas file;
       the SVG export dropped the style blocks. */
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes blink{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
    @keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-13px)}}
    @keyframes spark{0%{opacity:0;transform:translateY(6px) scale(.6)}35%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(1)}}
    @keyframes tilt{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-6deg)}}
    @keyframes think{0%,70%,100%{opacity:0;transform:scale(.5)}25%,55%{opacity:1;transform:scale(1)}}
    @keyframes shove{0%,100%{transform:translateX(0)}55%{transform:translateX(9px)}}
    @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.04)}}
    @keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
    .bob{animation:bob 1.3s ease-in-out infinite}
    .d{animation:blink 1.15s ease-in-out infinite}
    .d2{animation-delay:.14s}.d3{animation-delay:.28s}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  ]]></style><metadata><c2pa:manifest></c2pa:manifest></metadata>

<g transform="translate(10 4)"><g class="bob"><path d="M26 68 Q13 72 15 82" fill="none" stroke="#fdfaf4" stroke-width="5.5" stroke-linecap="round"></path><path d="M94 68 Q107 72 105 82" fill="none" stroke="#fdfaf4" stroke-width="5.5" stroke-linecap="round"></path><path d="M46 100 V109" fill="none" stroke="#fdfaf4" stroke-width="6" stroke-linecap="round"></path><path d="M74 100 V109" fill="none" stroke="#fdfaf4" stroke-width="6" stroke-linecap="round"></path><rect x="26" y="14" width="68" height="86" rx="17" fill="none" stroke="#fdfaf4" stroke-width="6"></rect><circle cx="48" cy="48" r="5.5" fill="#fdfaf4"></circle><circle cx="72" cy="48" r="5.5" fill="#fdfaf4"></circle><path d="M50 64 Q60 74 70 64" fill="none" stroke="#fdfaf4" stroke-width="5" stroke-linecap="round"></path><circle cx="60" cy="86" r="7" fill="none" stroke="#e8c98a" stroke-width="4"></circle></g></g>
<g fill="#e8c98a"><circle class="d" cx="52" cy="142" r="4.5"></circle><circle class="d d2" cx="70" cy="142" r="4.5"></circle><circle class="d d3" cx="88" cy="142" r="4.5"></circle></g>
</svg>
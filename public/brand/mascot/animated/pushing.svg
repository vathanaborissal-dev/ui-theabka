<svg xmlns="http://www.w3.org/2000/svg" width="190" height="140" viewBox="0 0 190 140" role="img" aria-label="Thiep pushing" xmlns:c2pa="http://c2pa.org/manifest"><style><![CDATA[
    /* Keyframes as authored by the design team in their canvas file;
       the SVG export dropped the style blocks. */
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes blink{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
    @keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-13px)}}
    @keyframes spark{0%{opacity:0;transform:translateY(6px) scale(.6)}35%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(1)}}
    @keyframes tilt{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-6deg)}}
    @keyframes think{0%,70%,100%{opacity:0;transform:scale(.5)}25%,55%{opacity:1;transform:scale(1)}}
    @keyframes shove{0%,100%{transform:translateX(0)}55%{transform:translateX(9px)}}
    @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.04)}}
    @keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
    .push{animation:shove 1.7s ease-in-out infinite}
    .lean{transform-box:view-box;transform-origin:60px 118px;animation:tilt 1.7s ease-in-out infinite}
    .obj{animation:shove 1.7s ease-in-out .07s infinite}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  ]]></style><metadata><c2pa:manifest></c2pa:manifest></metadata>

<rect x="0" y="124" width="190" height="3" rx="1.5" fill="#e3d7c4"></rect>
<g transform="translate(4 18) scale(.9)"><g class="push"><g class="lean"><path d="M26 68 Q13 72 15 82" fill="none" stroke="#8c2f39" stroke-width="5.5" stroke-linecap="round"></path><path d="M94 66 Q116 58 126 68" fill="none" stroke="#8c2f39" stroke-width="5.5" stroke-linecap="round"></path><path d="M46 100 V109" fill="none" stroke="#8c2f39" stroke-width="6" stroke-linecap="round"></path><path d="M74 100 V109" fill="none" stroke="#8c2f39" stroke-width="6" stroke-linecap="round"></path><rect x="26" y="14" width="68" height="86" rx="17" fill="#fdfaf4" stroke="#8c2f39" stroke-width="6"></rect><circle cx="38" cy="60" r="4.5" fill="#c39b52" opacity=".55"></circle><circle cx="82" cy="60" r="4.5" fill="#c39b52" opacity=".55"></circle><circle cx="48" cy="48" r="5.5" fill="#8c2f39"></circle><circle cx="72" cy="48" r="5.5" fill="#8c2f39"></circle><path d="M52 65 Q60 70 68 65" fill="none" stroke="#8c2f39" stroke-width="4.5" stroke-linecap="round"></path><circle cx="60" cy="86" r="8" fill="#c39b52"></circle></g></g></g>
<g class="obj"><rect x="120" y="50" width="56" height="72" rx="12" fill="#fdfaf4" stroke="#8c2f39" stroke-width="6"></rect><circle cx="148" cy="86" r="8" fill="#c39b52"></circle></g>
</svg>
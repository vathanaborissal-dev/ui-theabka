<svg xmlns="http://www.w3.org/2000/svg" width="156" height="150" viewBox="0 0 156 150" role="img" aria-label="Thiep thinking" xmlns:c2pa="http://c2pa.org/manifest"><style><![CDATA[
    /* Keyframes as authored by the design team in their canvas file;
       the SVG export dropped the style blocks. */
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes blink{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
    @keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-13px)}}
    @keyframes spark{0%{opacity:0;transform:translateY(6px) scale(.6)}35%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(1)}}
    @keyframes tilt{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-6deg)}}
    @keyframes think{0%,70%,100%{opacity:0;transform:scale(.5)}25%,55%{opacity:1;transform:scale(1)}}
    @keyframes shove{0%,100%{transform:translateX(0)}55%{transform:translateX(9px)}}
    @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.04)}}
    @keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
    .tilt{transform-box:view-box;transform-origin:70px 130px;animation:tilt 3s ease-in-out infinite}
    .th{transform-box:fill-box;transform-origin:center;animation:think 2.4s ease-in-out infinite}
    .t2{animation-delay:.3s}.t3{animation-delay:.6s}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  ]]></style><metadata><c2pa:manifest></c2pa:manifest></metadata>

<g fill="#c39b52"><circle class="th" cx="116" cy="46" r="3"></circle><circle class="th t2" cx="130" cy="30" r="4"></circle><circle class="th t3" cx="146" cy="14" r="5.5"></circle></g>
<g transform="translate(4 24)"><g class="tilt"><path d="M26 68 Q13 72 15 82" fill="none" stroke="#8c2f39" stroke-width="5.5" stroke-linecap="round"></path><path d="M94 70 Q114 62 92 44" fill="none" stroke="#8c2f39" stroke-width="5.5" stroke-linecap="round"></path><path d="M46 100 V109" fill="none" stroke="#8c2f39" stroke-width="6" stroke-linecap="round"></path><path d="M74 100 V109" fill="none" stroke="#8c2f39" stroke-width="6" stroke-linecap="round"></path><rect x="26" y="14" width="68" height="86" rx="17" fill="#fdfaf4" stroke="#8c2f39" stroke-width="6"></rect><circle cx="38" cy="60" r="4.5" fill="#c39b52" opacity=".55"></circle><circle cx="82" cy="60" r="4.5" fill="#c39b52" opacity=".55"></circle><g class="eye"><circle cx="48" cy="48" r="5.5" fill="#8c2f39"></circle><circle cx="72" cy="48" r="5.5" fill="#8c2f39"></circle></g><path d="M52 65 Q60 70 68 65" fill="none" stroke="#8c2f39" stroke-width="4.5" stroke-linecap="round"></path><circle cx="60" cy="86" r="8" fill="#c39b52"></circle></g></g>
</svg>